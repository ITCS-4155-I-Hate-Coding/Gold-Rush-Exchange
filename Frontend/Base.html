<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gold Rush Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Base.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <h1 class="brand">Gold Rush Exchange</h1>
        <nav class="tabs">
          <button class="tab active" data-tab="posts">Posts</button>
          <button class="tab" data-tab="predictions">Predictions</button>
          <button class="tab" data-tab="leaderboard">Leaderboard</button>
          <button class="tab" data-tab="following" id="followingTab" hidden>Following</button>
          <button class="tab" data-tab="compare" id="compareTab" hidden>Compare</button>
          <button class="tab" data-tab="profile" id="profileTab" hidden>Profile</button>
        </nav>
        <div class="auth">
          <span id="userLabel" hidden></span>
          <span id="repBadge" class="badge" hidden></span>
          <button id="authBtn" class="btn btn-gold">Log in</button>
        </div>
      </div>
    </header>

    <main>
      <section id="posts" class="panel">
        <div class="posts-head">
          <h2>Posts</h2>
          <div class="seg" id="postView" role="group" aria-label="Show posts" hidden>
            <button type="button" data-v="global" aria-pressed="true">Global</button>
            <button type="button" data-v="following" aria-pressed="false">Following</button>
          </div>
        </div>
        <form id="postForm" class="card" hidden>
          <textarea
            id="postBody"
            placeholder="Share something with the exchange"
            rows="3"
            required
          ></textarea>
          <button class="btn">Post</button>
        </form>
        <p class="hint" id="postsHint">Log in to write a post.</p>
        <div id="postList"></div>
      </section>

      <section id="predictions" class="panel" hidden>
        <div
          class="row"
          style="align-items: center; justify-content: space-between"
        >
          <h2>Upcoming Games</h2>
          <button type="button" id="syncGamesBtn" class="btn btn-outline">
            Sync games
          </button>
        </div>
        <div
          id="gameFilters"
          class="filters"
          role="group"
          aria-label="Filter games"
        ></div>
        <div id="gamesList"></div>
        <button
          type="button"
          id="gamesMore"
          class="btn btn-outline more"
          hidden
        ></button>

        <div
          class="row"
          style="align-items: center; justify-content: space-between"
        >
          <h2>Predictions</h2>
          <div
            class="seg"
            id="predView"
            role="group"
            aria-label="Show predictions"
          >
            <button type="button" data-v="mine" aria-pressed="true">
              My Picks
            </button>
            <button type="button" data-v="all" aria-pressed="false">
              Community
            </button>
          </div>
        </div>

        <p class="hint" id="predHint">Log in to make a prediction.</p>
        <div id="predList"></div>
      </section>

      <section id="leaderboard" class="panel" hidden>
        <div class="posts-head">
          <h2>Leaderboard</h2>
          <div class="seg" id="lbView" role="group" aria-label="Show leaderboard" hidden>
            <button type="button" data-v="global" aria-pressed="true">Global</button>
            <button type="button" data-v="following" aria-pressed="false">Following</button>
          </div>
        </div>
        <div id="lbList"></div>
      </section>

      <section id="following" class="panel" hidden>
        <div class="card">
          <input
            id="userSearch"
            type="search"
            placeholder="Search usernames to follow"
            autocomplete="off"
          />
          <div id="searchResults"></div>
        </div>
        <div id="followingBody"></div>
      </section>

      <section id="compare" class="panel" hidden>
        <div class="posts-head">
          <h2>Compare</h2>
        </div>
        <div class="card">
          <div class="meta">Pick up to 5 friends to compare with you</div>
          <div id="comparePicker" class="chips"></div>
        </div>
        <div id="compareBody"></div>
      </section>      

      <section id="profile" class="panel" hidden>
        <div id="profileBody"></div>
      </section>
    </main>

    <dialog id="authDialog">
      <form id="authForm">
        <h2 id="authTitle">Log in</h2>
        <input
          id="username"
          placeholder="Username"
          autocomplete="username"
          hidden
        />
        <input
          id="email"
          type="email"
          placeholder="Charlotte email (@charlotte.edu)"
          autocomplete="email"
          required
        />
        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <p id="authError" class="error" hidden></p>
        <div class="row">
          <button class="btn" id="authSubmit" value="submit">Log in</button>
          <button type="button" class="btn btn-outline" id="authSwitch">
            Create account
          </button>
          <button class="btn btn-link" value="cancel" formnovalidate>
            Cancel
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="predDialog" aria-labelledby="predTitle">
      <form id="predForm" method="dialog" novalidate>
        <h3 id="predTitle">Make your pick</h3>
        <p class="meta" id="predMeta"></p>
        <div class="pick-grid" role="group" aria-label="Your pick">
          <button
            type="button"
            class="pick-btn"
            data-pick="away"
            aria-pressed="false"
          ></button>
          <button
            type="button"
            class="pick-btn"
            data-pick="home"
            aria-pressed="false"
          ></button>
        </div>
        <label for="predPoints">Wager <span id="predBalance"></span></label>
        <div class="chips" id="predChips">
          <button type="button" class="chip" data-pts="10">10</button>
          <button type="button" class="chip" data-pts="25">25</button>
          <button type="button" class="chip" data-pts="50">50</button>
          <button type="button" class="chip" data-pts="max">Max</button>
        </div>
        <input
          id="predPoints"
          type="number"
          min="1"
          inputmode="numeric"
          placeholder="Reputation points"
        />
        <p class="outcome" id="predOutcome" aria-live="polite"></p>
        <p class="error" id="predError" role="alert"></p>
        <div class="row">
          <button class="btn" id="predSubmit">Submit prediction</button>
          <button class="btn btn-link" type="button" id="predCancel">
            Cancel
          </button>
        </div>
      </form>
    </dialog>
    <div id="successMessage" role="status" hidden></div>

    <script src="Base.js"></script>
  </body>
</html>
